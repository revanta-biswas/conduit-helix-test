# SonarQube configuration — generated by AIRE. Only ${SLOT} values vary (Section 4.1.1).
# 🔴 sonar.organization is left as YOUR_ORG_NAME for the user to set; AIRE cannot know the org key.
#    Self-hosted SonarQube does not use organizations — delete that line instead.
# 🔴 No token belongs in this file. SONAR_TOKEN / SONAR_HOST_URL are GitHub Actions secrets only.
#
# STATUS: generated but INACTIVE — the Section 4.1.2 setup gate was answered "skip" at STOP
# CHECKPOINT time (2026-09-07). sonarqube.enabled is false in tests/.evals/config.json and the
# scan step in .github/workflows/agentic-eval-pipeline.yml is commented out. This file is kept
# so a later "proceed" only needs the SONAR_TOKEN / SONAR_HOST_URL secrets and an organization
# name — no regeneration required.

sonar.projectKey=conduit-helix-test
sonar.projectName=conduit-helix-test
sonar.organization=YOUR_ORG_NAME

# 🔴 sonar.sources / sonar.tests below are REWRITTEN AT RUN TIME by the pipeline's
#    "Resolve Sonar scope" step, down to the paths that actually exist in the checkout.
#    A path here that does not exist yet (greenfield src/) would otherwise fail the scan
#    outright with "The folder 'src' does not exist" and take the quality gate with it.
# Tests are co-located with source (Vitest convention: *.test.js beside its source file) — per
# Section 4.1.1a, sonar.sources and sonar.tests must be disjoint, so test files are reclassified
# via sonar.test.inclusions rather than listed a second time under sonar.tests.
sonar.sources=backend,frontend/src
sonar.tests=
sonar.test.inclusions=backend/**/*.test.js,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**

# Coverage report path for the detected test runner (lcov — vitest --coverage):
sonar.javascript.lcov.reportPaths=coverage/backend/lcov.info,coverage/frontend/lcov.info

sonar.sourceEncoding=UTF-8
